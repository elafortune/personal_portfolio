//  INDEXEDDB — STOCKAGE FICHIERS
// ═══════════════════════════════════════════
let _DB = null;
function initDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open('ait_filestore',1);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('files'))
        db.createObjectStore('files',{keyPath:'id'});
    };
    req.onsuccess=e=>{_DB=e.target.result;res(_DB);};
    req.onerror=rej;
  });
}
function dbPut(obj){
  return new Promise((res,rej)=>{
    const tx=_DB.transaction('files','readwrite');
    tx.objectStore('files').put(obj);
    tx.oncomplete=res; tx.onerror=rej;
  });
}
function dbGet(id){
  return new Promise(res=>{
    const tx=_DB.transaction('files','readonly');
    const req=tx.objectStore('files').get(id);
    req.onsuccess=()=>res(req.result||null);
    req.onerror=()=>res(null);
  });
}
function dbDel(id){
  return new Promise(res=>{
    const tx=_DB.transaction('files','readwrite');
    tx.objectStore('files').delete(id);
    tx.oncomplete=res; tx.onerror=res;
  });
}

function formatSize(bytes){
  if(bytes<1024)return bytes+'o';
  if(bytes<1048576)return (bytes/1024).toFixed(1)+'Ko';
  return (bytes/1048576).toFixed(1)+'Mo';
}
function fileTypeLabel(mime){
  if(mime.startsWith('image/'))return'Image';
  if(mime==='application/pdf')return'PDF';
  return'Fichier';
}
function fileTypeColor(mime){
  if(mime.startsWith('image/'))return'#10b981';
  if(mime==='application/pdf')return'#ef4444';
  return'#64748b';
}
function fileIcon(mime){
  if(mime.startsWith('image/'))return'🖼';
  if(mime==='application/pdf')return'📄';
  return'📎';
}

function handleFileDrop(files,resourceId,taskId){
  if(!files||!files.length)return;
  const resId=document.getElementById('fu_res')?.value||resourceId||null;
  const tskId=document.getElementById('fu_task')?.value||taskId||null;
  const desc=document.getElementById('fu_desc')?.value||'';
  const imp=document.getElementById('fu_imp')?.checked||false;
  const arr=Array.from(files);
  let count=0;
  arr.forEach(file=>{
    if(!file.type.startsWith('image/')&&file.type!=='application/pdf'){
      notify('Format non supporté : '+file.name,'err');return;
    }
    if(file.size>30*1024*1024){notify('Fichier trop lourd (max 30Mo) : '+file.name,'err');return;}
    const reader=new FileReader();
    reader.onload=e=>{
      const meta={id:uid(),name:file.name,mime:file.type,size:file.size,
        resourceId:resId||null,taskId:tskId||null,
        description:desc,important:imp,createdAt:n()};
      dbPut({id:meta.id,data:e.target.result}).then(()=>{
        S.fileMeta.push(meta);save();count++;
        if(count===arr.length){closeModal();render();notify(count+' fichier(s) ajouté(s)');}
      });
    };
    reader.readAsDataURL(file);
  });
}

function toggleFileImportant(fileId){
  const meta=S.fileMeta.find(f=>f.id===fileId);

}

function downloadFile(fileId){
  const meta=S.fileMeta.find(f=>f.id===fileId);
  if(!meta)return;
  dbGet(fileId).then(record=>{
    if(!record)return;
    const a=document.createElement('a');
    a.href=record.data;a.download=meta.name;a.click();
  });
}

function deleteFile(fileId){
  if(!confirm('Supprimer ce fichier ?'))return;
  S.fileMeta=S.fileMeta.filter(f=>f.id!==fileId);
  dbDel(fileId);save();
  document.getElementById('flashcard-root').innerHTML='';
  render();notify('Fichier supprimé');
}

// ═══════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════
function n(){return new Date().toISOString();}
function uid(){return '_'+Math.random().toString(36).substr(2,9);}
function tod(){return new Date().toISOString().split('T')[0];}
function addDays(dateStr,d){const dt=new Date(dateStr);dt.setDate(dt.getDate()+d);return dt.toISOString().split('T')[0];}
function daysBetween(a,b){return Math.floor((new Date(b)-new Date(a))/86400000);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sColor(s){return{todo:'#94a3b8',inprogress:'#f59e0b',done:'#10b981'}[s]||'#94a3b8';}
function sLabel(s){return{todo:'A faire',inprogress:'En cours',done:'Termine'}[s]||s;}
function pColor(p){return{high:'#ef4444',medium:'#f59e0b',low:'#10b981'}[p]||'#94a3b8';}
function pLabel(p){return{high:'Haute',medium:'Moyenne',low:'Basse'}[p]||p;}
function catLabel(c){return{book:'Livre',course:'Cours',video:'Video',paper:'Paper',tool:'Outil',other:'Autre'}[c]||c;}
function phaseChip(id){const p=PHASES[id];if(!p)return'';return`<span class="chip" style="color:${p.color};background:${p.bg};">${p.short}</span>`;}
function sChip(s){return`<span class="chip" style="color:${sColor(s)};background:${sColor(s)}18;">${sLabel(s)}</span>`;}
function bar(pct,color,h='7px'){return`<div class="pbar" style="height:${h};"><div class="pfill" style="width:${Math.min(pct,100)}%;background:${color};height:100%;"></div></div>`;}

function getWeekDays(){
  const now=new Date(),dow=now.getDay();
  const mon=new Date(now);mon.setDate(now.getDate()-(dow===0?6:dow-1));
  return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d.toISOString().split('T')[0];});
}
function dayLabel(dateStr){
  return new Date(dateStr+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric'});
}
function dayLabelLong(dateStr){
  return new Date(dateStr+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
function getCalendarTasks(dateStr){
  const seen=new Set(),result=[];
  S.tasks.forEach(t=>{
    const inDue=t.dueDate===dateStr;
    const inSprint=S.sprint[t.id]===dateStr;
    const inMIT=(S.mit[dateStr]||[]).includes(t.id);
    if((inDue||inSprint||inMIT)&&!seen.has(t.id)){seen.add(t.id);result.push({...t,_inDue:inDue,_inSprint:inSprint,_inMIT:inMIT});}
  });
  return result.sort((a,b)=>{const o={done:2,todo:0,inprogress:-1};return (o[a.status]||0)-(o[b.status]||0);});
}
function navigateCal(dateStr,from){
  S.calendarDate=dateStr;S.calendarFrom=from||S.view;S.view='calendar';render();
}

function save(){
  localStorage.setItem('ait_tasks',JSON.stringify(S.tasks));
  localStorage.setItem('ait_res',JSON.stringify(S.resources));
  localStorage.setItem('ait_journal',JSON.stringify(S.journal));
  localStorage.setItem('ait_mit',JSON.stringify(S.mit));
  localStorage.setItem('ait_sprint',JSON.stringify(S.sprint));
  localStorage.setItem('ait_scap',JSON.stringify(S.sprintCap));
  localStorage.setItem('ait_ms',JSON.stringify(S.milestones));
  localStorage.setItem('ait_streak',S.streak);
  localStorage.setItem('ait_lastActive',S.lastActive);
  localStorage.setItem('ait_startDate',S.startDate);
  localStorage.setItem('ait_filemeta',JSON.stringify(S.fileMeta));
}
function load(){
  const t=localStorage.getItem('ait_tasks'),r=localStorage.getItem('ait_res'),j=localStorage.getItem('ait_journal');
  S.tasks=t?JSON.parse(t):SEED_TASKS;
  S.resources=r?JSON.parse(r):SEED_RESOURCES;
  S.journal=j?JSON.parse(j):[];
  S.mit=JSON.parse(localStorage.getItem('ait_mit')||'{}');
  S.sprint=JSON.parse(localStorage.getItem('ait_sprint')||'{}');
  S.sprintCap=JSON.parse(localStorage.getItem('ait_scap')||'{"1":3,"2":3,"3":3,"4":3,"5":3,"6":8,"0":6}');
  S.milestones=JSON.parse(localStorage.getItem('ait_ms')||'{}');
  S.streak=parseInt(localStorage.getItem('ait_streak')||'0');
  S.lastActive=localStorage.getItem('ait_lastActive')||null;
  S.startDate=localStorage.getItem('ait_startDate')||tod();
  S.fileMeta=JSON.parse(localStorage.getItem('ait_filemeta')||'[]');
  if(!localStorage.getItem('ait_startDate'))save();
  // Streak
  const t2=tod(),yest=addDays(t2,-1);
  if(S.lastActive!==t2){S.streak=(S.lastActive===yest)?S.streak+1:1;S.lastActive=t2;save();}
}

// ═══════════════════════════════════════════
//  COMPUTED
// ═══════════════════════════════════════════
function phasePct(ph){const t=S.tasks.filter(x=>x.phase===ph);return t.length?Math.round(t.filter(x=>x.status==='done').length/t.length*100):0;}
function daysSinceStart(){return S.startDate?Math.max(0,daysBetween(S.startDate,tod())):0;}
function currentPhase(){const d=daysSinceStart();return d<90?'phase0':d<270?'phase1':d<540?'phase2':'phase3';}
function todayTasks(){const t=tod();return S.tasks.filter(x=>x.status!=='done'&&((x.dueDate&&x.dueDate<=t)||x.status==='inprogress'));}
function overdueTasks(){const t=tod();return S.tasks.filter(x=>x.status!=='done'&&x.dueDate&&x.dueDate<t);}
function dueReviews(){const t=tod();return S.journal.filter(e=>e.nextReview&&e.nextReview<=t);}
function todayMIT(){return (S.mit[tod()]||[]).map(id=>S.tasks.find(t=>t.id===id)).filter(Boolean);}
function subtaskPct(task){const s=task.subtasks||[];return s.length?Math.round(s.filter(x=>x.done).length/s.length*100):null;}
function sprintPomodosForDay(dateStr){
  return Object.entries(S.sprint).filter(([tid,d])=>d===dateStr).reduce((acc,[tid])=>{const t=S.tasks.find(x=>x.id===tid);return acc+(t?t.pomodoros:0);},0);
}
function calcNextReview(understanding,prevInterval=1){
  if(understanding<=2)return addDays(tod(),1);
  if(understanding===3)return addDays(tod(),Math.max(3,Math.round(prevInterval*1.3)));
  if(understanding===4)return addDays(tod(),Math.round(prevInterval*1.8));
  return addDays(tod(),Math.round(prevInterval*2.5));
}

function notify(msg,type='ok'){
  const d=document.createElement('div');

  document.getElementById('notif-root').appendChild(d);
  setTimeout(()=>{d.style.animation='sOut .22s ease forwards';setTimeout(()=>d.remove(),220);},2600);
}
function playBeep(){try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=528;g.gain.setValueAtTime(.3,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+1.2);o.start();o.stop(c.currentTime+1.2);}catch(e){}}

function startSession(taskId,subtaskIdx=0){
  const task=S.tasks.find(t=>t.id===taskId);if(!task)return;
  if(SES._iv)clearInterval(SES._iv);
  SES={active:true,taskId,subtaskIdx,timeLeft:25*60,running:false,_iv:null};
  closeModal();renderSession();
}

function renderSession(){
  const task=S.tasks.find(t=>t.id===SES.taskId);
  const subs=task?.subtasks||[];
  const sub=subs[SES.subtaskIdx];
  const mins=String(Math.floor(SES.timeLeft/60)).padStart(2,'0');
  const secs=String(SES.timeLeft%60).padStart(2,'0');
  const subsDone=subs.filter(s=>s.done).length;
  document.getElementById('session-root').innerHTML=`
  <div class="s-overlay">
    <div style="text-align:center;max-width:580px;padding:32px;width:100%;">
      <div style="font-size:11px;color:#475569;letter-spacing:.08em;text-transform:uppercase;margin-bottom:24px;">MODE SESSION — FOCUS</div>
      <div style="font-size:15px;color:#64748b;margin-bottom:8px;">${esc(task?.title||'')}</div>
      ${sub?`<div style="font-size:20px;font-weight:700;color:#e2e8f0;margin-bottom:6px;">${esc(sub.title)}</div>`:'<div style="font-size:18px;color:#94a3b8;margin-bottom:6px;">Session libre</div>'}
      ${subs.length?`<div style="font-size:12px;color:#475569;margin-bottom:32px;">Sous-tache ${SES.subtaskIdx+1}/${subs.length} • ${subsDone} terminees</div>`:'<div style="margin-bottom:32px;"></div>'}
      <div id="session-timer" style="font-size:72px;font-weight:700;color:#60a5fa;letter-spacing:-2px;font-variant-numeric:tabular-nums;margin-bottom:8px;">${mins}:${secs}</div>
      <div style="font-size:12px;color:#475569;margin-bottom:32px;">${SES.running?'En cours...':'Pret a demarrer'}</div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
        <button class="btn btn-primary" id="session-toggle" onclick="toggleSession()">${SES.running?'Pause':'Demarrer'}</button>
        ${sub?`<button class="btn btn-success" onclick="completeSubtask()">Sous-tache terminee</button>`:''}
        <button class="btn btn-secondary" onclick="endSession()">Terminer session</button>
      </div>
      ${subs.length?`<div style="margin-top:28px;text-align:left;background:#1e293b;border-radius:10px;padding:14px;">
        <div style="font-size:11px;color:#475569;margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em;">Sous-taches</div>
        ${subs.map((s,i)=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;">
          <span style="color:${s.done?'#10b981':i===SES.subtaskIdx?'#60a5fa':'#475569'};font-size:13px;">${s.done?'✓':i===SES.subtaskIdx?'▶':'○'}</span>
          <span style="font-size:13px;color:${s.done?'#475569':i===SES.subtaskIdx?'#e2e8f0':'#64748b'};${s.done?'text-decoration:line-through;':''}">${esc(s.title)}</span>
          <span style="font-size:11px;color:#475569;margin-left:auto;">🍅${s.pomodoros}</span>
        </div>`).join('')}
      </div>`:''}
    </div>
  </div>`;
}

function toggleSession(){
  if(SES.running){clearInterval(SES._iv);SES._iv=null;SES.running=false;}
  else{
    SES.running=true;
    SES._iv=setInterval(()=>{
      SES.timeLeft--;
      const el=document.getElementById('session-timer');
      const btn=document.getElementById('session-toggle');
      if(el)el.textContent=String(Math.floor(SES.timeLeft/60)).padStart(2,'0')+':'+String(SES.timeLeft%60).padStart(2,'0');
      if(SES.timeLeft<=0){clearInterval(SES._iv);SES._iv=null;SES.running=false;playBeep();SES.timeLeft=0;showSessionEnd();}
    },1000);
  }
  const btn=document.getElementById('session-toggle');
  if(btn)btn.textContent=SES.running?'Pause':'Reprendre';
}

function showSessionEnd(){
  const el=document.querySelector('#session-root .s-overlay');
  if(!el)return;
  el.innerHTML=`<div style="text-align:center;max-width:480px;padding:32px;">
    <div style="font-size:48px;margin-bottom:16px;">✅</div>
    <div style="font-size:22px;font-weight:700;margin-bottom:8px;">Pomodoro termine !</div>
    <div style="font-size:14px;color:#64748b;margin-bottom:28px;">Prends 5 minutes de pause.</div>
    <div style="font-size:14px;font-weight:600;color:#94a3b8;margin-bottom:10px;">Qu'as-tu retenu ou appris ?</div>
    <textarea class="input" id="session-note" placeholder="Note rapide..." style="margin-bottom:16px;"></textarea>
    <div style="display:flex;gap:10px;justify-content:center;">
      <button class="btn btn-primary" onclick="saveSessionNote()">Sauvegarder et continuer</button>
      <button class="btn btn-secondary" onclick="endSession()">Terminer</button>
    </div>
  </div>`;
}

function saveSessionNote(){
  const note=document.getElementById('session-note')?.value.trim();
  if(note){
    const task=S.tasks.find(t=>t.id===SES.taskId);
    S.journal.push({id:uid(),title:`Session: ${task?.title||'Tache'}`,content:note,understanding:3,linkedTaskId:SES.taskId,nextReview:addDays(tod(),4),prevInterval:4,reviewHistory:[],createdAt:n()});
    save();notify('Note ajoutee au journal');
  }
  SES.timeLeft=25*60;SES.running=false;renderSession();
}

function completeSubtask(){
  const task=S.tasks.find(t=>t.id===SES.taskId);
  if(!task||!task.subtasks)return;
  if(task.subtasks[SES.subtaskIdx]){task.subtasks[SES.subtaskIdx].done=true;}
  const next=task.subtasks.findIndex((s,i)=>i>SES.subtaskIdx&&!s.done);
  if(next>=0){SES.subtaskIdx=next;}
  else{
    const allDone=task.subtasks.every(s=>s.done);
    if(allDone){task.status='done';task.completedAt=n();notify('Toutes les sous-taches terminees !');}
  }
  clearInterval(SES._iv);SES._iv=null;SES.running=false;SES.timeLeft=25*60;
  save();renderSession();
}

function endSession(){
  clearInterval(SES._iv);SES._iv=null;
  SES.active=false;
  document.getElementById('session-root').innerHTML='';
  save();render();
}

function startFlashCards(){
  S.reviewIdx=0;S.reviewFlipped=false;

}

function renderFlashCard(){
  const due=dueReviews();
  if(!due.length||S.reviewIdx>=due.length){
    document.getElementById('flashcard-root').innerHTML='';
    notify('Revisions terminees !');S.journalMode='list';render();return;
  }
  const entry=due[S.reviewIdx];
  document.getElementById('flashcard-root').innerHTML=`
  <div style="position:fixed;inset:0;background:#00000095;z-index:150;display:flex;align-items:center;justify-content:center;padding:20px;">
    <div style="max-width:560px;width:100%;text-align:center;">
      <div style="font-size:12px;color:#475569;margin-bottom:20px;">${S.reviewIdx+1} / ${due.length} cartes a revoir</div>
      <div class="flashcard">
        <div style="font-size:11px;color:#64748b;margin-bottom:16px;text-transform:uppercase;letter-spacing:.06em;">Concept a rappeler</div>
        <div style="font-size:20px;font-weight:700;color:#e2e8f0;margin-bottom:${S.reviewFlipped?'20px':'0'};">${esc(entry.title)}</div>
        ${S.reviewFlipped?`
          <hr style="border:none;border-top:1px solid #334155;margin:20px 0;">
          <div style="font-size:14px;color:#94a3b8;line-height:1.7;text-align:left;">${esc(entry.content)}</div>
          <div style="margin-top:28px;">
            <div style="font-size:13px;color:#64748b;margin-bottom:14px;">Comment etait ton rappel ?</div>
            <div style="display:flex;gap:8px;justify-content:center;">
              ${[1,2,3,4,5].map(i=>`<button onclick="rateCard(${i})" style="width:44px;height:44px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:${i<=2?'#ef4444':i===3?'#f59e0b':'#10b981'};font-size:18px;cursor:pointer;font-weight:700;">${i}</button>`).join('')}
            </div>
            <div style="display:flex;justify-content:space-between;font-size:11px;color:#475569;margin-top:6px;padding:0 4px;">
              <span>Oublie</span><span>Parfait</span>
            </div>
          </div>
        `:`<div style="margin-top:28px;"><button class="btn btn-primary" onclick="flipCard()">Voir la reponse</button></div>`}
      </div>
      <button onclick="document.getElementById('flashcard-root').innerHTML='';render();" style="margin-top:16px;background:none;border:none;color:#475569;cursor:pointer;font-size:13px;">Quitter la revision</button>
    </div>
  </div>`;
}

function flipCard(){S.reviewFlipped=true;renderFlashCard();}

function rateCard(score){
  const due=dueReviews();const entry=due[S.reviewIdx];
  if(!entry)return;
  const idx=S.journal.findIndex(e=>e.id===entry.id);if(idx<0)return;
  const prevInt=S.journal[idx].prevInterval||4;
  const nextDate=calcNextReview(score,prevInt);
  const newInterval=daysBetween(tod(),nextDate);
  S.journal[idx].nextReview=nextDate;
  S.journal[idx].prevInterval=newInterval;
  S.journal[idx].understanding=score;
  S.journal[idx].reviewHistory=[...(S.journal[idx].reviewHistory||[]),{date:tod(),score}];
  save();
  S.reviewIdx++;S.reviewFlipped=false;
  renderFlashCard();
}

function saveTask(taskId){
  const title=document.getElementById('f_t')?.value.trim();
  if(!title){notify('Titre requis','err');return;}
  const status=document.getElementById('f_s').value;
  const tags=document.getElementById('f_tags').value.split(',').map(x=>x.trim()).filter(Boolean);
  const subtasks=_tempSubtasks.map(s=>({...s}));
  const totalPomos=subtasks.length?subtasks.reduce((a,s)=>a+(s.pomodoros||1),0):parseInt(document.getElementById('f_p').value)||2;
  if(taskId){
    const idx=S.tasks.findIndex(t=>t.id===taskId);
    if(idx>-1)S.tasks[idx]={...S.tasks[idx],title,description:document.getElementById('f_d').value,phase:document.getElementById('f_ph').value,status,priority:document.getElementById('f_pr').value,week:parseInt(document.getElementById('f_w').value)||1,pomodoros:totalPomos,dueDate:document.getElementById('f_due').value,tags,subtasks,completedAt:status==='done'?n():null};
  }else{
    S.tasks.push({id:uid(),title,description:document.getElementById('f_d').value,phase:document.getElementById('f_ph').value,status,priority:document.getElementById('f_pr').value,week:parseInt(document.getElementById('f_w').value)||1,pomodoros:totalPomos,dueDate:document.getElementById('f_due').value,tags,subtasks,createdAt:n(),completedAt:null});
  }
  save();closeModal();render();notify(taskId?'Tache mise a jour':'Tache creee');
}

  if(!confirm('Supprimer ?'))return;
  S.tasks=S.tasks.filter(t=>t.id!==taskId);

  const title=document.getElementById('jf_t')?.value.trim();if(!title){notify('Titre requis','err');return;}
  const understanding=window._jScore||3;
  const nextReview=calcNextReview(understanding,4);
  const data={title,content:document.getElementById('jf_c').value,understanding,linkedTaskId:document.getElementById('jf_task').value||null,nextReview,prevInterval:daysBetween(tod(),nextReview),reviewHistory:[]};
  if(eId){const idx=S.journal.findIndex(e=>e.id===eId);if(idx>-1)S.journal[idx]={...S.journal[idx],...data,reviewHistory:S.journal[idx].reviewHistory};}
  else S.journal.push({id:uid(),...data,createdAt:n()});
  save();closeModal();render();notify(eId?'Note mise a jour':'Note ajoutee au journal');
}

function deleteJournal(eId){
  if(!confirm('Supprimer ?'))return;
  S.journal=S.journal.filter(e=>e.id!==eId);
  save();closeModal();render();
}

function removeFromSprint(taskId){
  delete S.sprint[taskId];save();render();

function updateSprintCap(dow,val){

}

function viewMonthly(){
  const now2=new Date(),year=now2.getFullYear(),month=now2.getMonth();
  const firstDay=new Date(year,month,1).getDay(),daysInMonth=new Date(year,month+1,0).getDate();
  const todayN=now2.getDate(),monthName=now2.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  const weekDays=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  let cells=[];for(let i=0;i<firstDay;i++)cells.push(null);for(let i=1;i<=daysInMonth;i++)cells.push(i);
  const maxWeek=Math.max(...S.tasks.map(t=>t.week||0),1);
  return`<div style="padding:26px 30px;max-width:880px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;">
      <h1 style="font-size:21px;font-weight:700;">Vue mensuelle</h1>

    </div>

      <div class="gcal">${cells.map(day=>{
        if(!day)return'<div></div>';
        const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const dt=S.tasks.filter(t=>t.dueDate===ds),isT=day===todayN,allD=dt.length>0&&dt.every(t=>t.status==='done');
        const calTasks=getCalendarTasks(ds);
        return`<div class="cal-day ${isT?'today':''}" onclick="navigateCal('${ds}','monthly')" style="cursor:pointer;${allD?'border-color:#10b98140;background:#10b98108;':''}${calTasks.length>0&&!allD?'border-color:#3b82f630;':''}">
          <div style="font-size:12px;font-weight:${isT?700:400};color:${isT?'#60a5fa':'#64748b'};">${day}</div>
          ${calTasks.slice(0,2).map(t=>`<div style="font-size:10px;padding:1px 3px;border-radius:3px;margin-top:2px;background:${sColor(t.status)}18;color:${sColor(t.status)};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${t.title.slice(0,10)}…</div>`).join('')}
          ${calTasks.length>2?`<div style="font-size:10px;color:#3b82f6;margin-top:1px;">+${calTasks.length-2}</div>`:''}
          ${calTasks.length===0?'':``}
        </div>`;
      }).join('')}</div>

    <div class="card">
      <h2 style="font-size:14px;font-weight:600;margin-bottom:18px;">Par semaine</h2>

        const tasks=S.tasks.filter(t=>t.week===w);if(!tasks.length)return'';
        const done=tasks.filter(t=>t.status==='done').length;
        return`<div style="margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #33415550;">
          <div style="display:flex;justify-content:space-between;margin-bottom:5px;">
            <span style="font-size:13px;font-weight:500;">Semaine ${w}</span>
            <span style="font-size:12px;color:${done===tasks.length?'#10b981':'#64748b'};">${done}/${tasks.length}</span>
          </div>
          ${bar(tasks.length?done/tasks.length*100:0,'#3b82f6')}
          <div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px;">${tasks.map(t=>`<span style="font-size:11px;background:${sColor(t.status)}15;color:${sColor(t.status)};padding:1px 7px;border-radius:999px;border:1px solid ${sColor(t.status)}25;">${t.title.slice(0,26)}${t.title.length>26?'…':''}</span>`).join('')}</div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function viewSprint(){
  const days=getWeekDays();
  const unassigned=S.tasks.filter(t=>t.status!=='done'&&!S.sprint[t.id]);
  return`<div style="padding:26px 30px;max-width:1100px;">
    <div style="margin-bottom:22px;">
      <h1 style="font-size:21px;font-weight:700;">Sprint hebdomadaire</h1>
      <p style="font-size:12px;color:#64748b;margin-top:3px;">Planifie tes taches sur la semaine selon ta capacite en pomodoros.</p>
    </div>
    <div style="display:grid;grid-template-columns:1fr 260px;gap:20px;">
      <!-- Week grid -->
      <div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:10px;">
          ${days.map((dateStr,i)=>{
            const dow=new Date(dateStr+'T12:00:00').getDay();
            const cap=S.sprintCap[dow]||0;
            const assignedTasks=Object.entries(S.sprint).filter(([tid,d])=>d===dateStr).map(([tid])=>S.tasks.find(t=>t.id===tid)).filter(Boolean);
            const usedPomos=assignedTasks.reduce((a,t)=>a+(t.pomodoros||0),0);
            const pct=cap>0?Math.min(usedPomos/cap*100,100):0;
            const isToday=dateStr===tod();
            return`<div class="sprint-day ${isToday?'current':''}" style="${isToday?'border-color:#3b82f640;background:#3b82f605;':''}">
              <div style="font-size:12px;font-weight:600;color:${isToday?'#60a5fa':'#94a3b8'};margin-bottom:5px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;" onclick="navigateCal('${dateStr}','sprint')">${dayLabel(dateStr)} <span style="font-size:10px;color:#3b82f6;opacity:.7;">→</span></div>
              <div style="display:flex;align-items:center;gap:5px;margin-bottom:7px;">
                <input type="number" value="${cap}" min="0" max="20" onchange="updateSprintCap(${dow},this.value)" style="background:#0f172a;border:1px solid #334155;border-radius:5px;padding:2px 5px;color:#f1f5f9;font-size:11px;width:38px;">
                <span style="font-size:11px;color:#475569;">🍅 max</span>
              </div>
              ${bar(pct,pct>90?'#ef4444':pct>70?'#f59e0b':'#10b981')}
              <div style="font-size:10px;color:#475569;margin-top:3px;margin-bottom:8px;">${usedPomos}/${cap} pomodoros</div>
              ${assignedTasks.map(t=>`<div style="background:#${PHASES[t.phase].color.slice(1)}18;border:1px solid #${PHASES[t.phase].color.slice(1)}30;border-radius:6px;padding:5px 7px;margin-bottom:4px;font-size:11px;display:flex;justify-content:space-between;align-items:flex-start;gap:4px;">
                <span style="color:#e2e8f0;line-height:1.3;">${t.title.slice(0,22)}${t.title.length>22?'…':''}</span>
                <button onclick="removeFromSprint('${t.id}')" style="background:none;border:none;color:#ef4444;cursor:pointer;font-size:14px;line-height:1;flex-shrink:0;">×</button>
              </div>`).join('')}
            </div>`;
          }).join('')}
        </div>
      </div>
      <!-- Backlog -->
      <div>
        <div class="card">
          <h2 style="font-size:13px;font-weight:700;margin-bottom:13px;color:#94a3b8;">BACKLOG <span style="font-weight:400;">(${unassigned.length})</span></h2>
          ${unassigned.length===0?`<p style="font-size:12px;color:#10b981;">Toutes les taches sont dans le sprint !</p>`:
          unassigned.map(t=>`<div style="background:#0f172a;border:1px solid #33415560;border-radius:8px;padding:9px;margin-bottom:6px;">
            <div style="font-size:12px;font-weight:500;color:#e2e8f0;margin-bottom:5px;">${t.title.slice(0,32)}${t.title.length>32?'…':''}</div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;">
              <div style="display:flex;gap:4px;">${phaseChip(t.phase)}<span style="font-size:11px;color:#475569;">🍅${t.pomodoros}</span></div>
              <select class="select" style="font-size:11px;padding:2px 6px;" onchange="if(this.value)assignToSprint('${t.id}',this.value);this.value=''">
                <option value="">+ Jour</option>
                ${days.map(d=>`<option value="${d}">${dayLabel(d)}</option>`).join('')}
              </select>
            </div>
          </div>`).join('')}
        </div>
      </div>
    </div>
  </div>`;
}

              <div style="font-size:18px;font-weight:700;color:${p.color};">${pct}%</div>

            </div>

            ${tasks.slice(0,5).map(t=>`<div style="display:flex;align-items:center;gap:7px;margin-bottom:4px;">

              <span style="font-size:12px;color:${t.status==='done'?'#64748b':'#e2e8f0'};${t.status==='done'?'text-decoration:line-through;':''}">${t.title}</span>
            </div>`).join('')}
            ${tasks.length>5?`<div style="font-size:11px;color:#64748b;margin-top:3px;cursor:pointer;" onclick="S.fPhase='${id}';navigate('tasks')">+${tasks.length-5} → <span style="color:#60a5fa;">Voir toutes</span></div>`:''}

      ${MILESTONES.map((m,i)=>{const c=!!S.milestones[i];return`<div style="display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid #33415535;">

function viewCalendar(){
  const dateStr=S.calendarDate||tod();
  const tasks=getCalendarTasks(dateStr);
  const prev=addDays(dateStr,-1),next=addDays(dateStr,1);
  const isToday=dateStr===tod();
  const fromLabel={monthly:'Vue mensuelle',sprint:'Sprint',dashboard:'Dashboard'}[S.calendarFrom]||'Retour';

  return`<div style="padding:26px 30px;max-width:820px;">
    <!-- Header nav -->
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap;">
      <button class="btn btn-secondary btn-sm" onclick="navigate('${S.calendarFrom||'monthly'}')">← ${fromLabel}</button>
      <button class="btn btn-secondary btn-sm" onclick="navigateCal('${prev}','${S.calendarFrom||'monthly'}')">‹</button>
      <div style="flex:1;text-align:center;">
        <h1 style="font-size:18px;font-weight:700;color:${isToday?'#60a5fa':'#f1f5f9'};text-transform:capitalize;">${dayLabelLong(dateStr)}</h1>
        ${isToday?`<span style="font-size:11px;color:#3b82f6;font-weight:600;">Aujourd'hui</span>`:''}
      </div>
      <button class="btn btn-secondary btn-sm" onclick="navigateCal('${next}','${S.calendarFrom||'monthly'}')">›</button>
      ${!isToday?`<button class="btn btn-secondary btn-sm" onclick="navigateCal('${tod()}','${S.calendarFrom||'monthly'}')">Aujourd'hui</button>`:''}
    </div>

    <!-- Sources legend -->
    <div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;">
      <span style="font-size:11px;color:#64748b;background:#334155;padding:2px 9px;border-radius:999px;">🗓 Echeance</span>
      <span style="font-size:11px;color:#64748b;background:#334155;padding:2px 9px;border-radius:999px;">⚡ Sprint</span>
      <span style="font-size:11px;color:#64748b;background:#334155;padding:2px 9px;border-radius:999px;">🎯 MIT</span>
    </div>

    <!-- Add task shortcut -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h2 style="font-size:14px;font-weight:600;color:#94a3b8;">${tasks.length===0?'Aucune tache ce jour':'TACHES DU JOUR ('+tasks.length+')'}</h2>
      <button class="btn btn-primary btn-sm" onclick="openTaskForDay('${dateStr}')">+ Ajouter une tache</button>
    </div>

    <!-- Task cards -->
    ${tasks.length===0?`
    <div class="card" style="text-align:center;padding:40px;border-style:dashed;">
      <div style="font-size:32px;margin-bottom:12px;">📅</div>
      <p style="color:#64748b;font-size:14px;">Aucune tache planifiee ce jour.</p>
      <button class="btn btn-primary" style="margin-top:16px;" onclick="openTaskForDay('${dateStr}')">+ Ajouter une tache pour ce jour</button>
    </div>`
    :tasks.map(t=>{
      const p=PHASES[t.phase];
      const subs=t.subtasks||[];
      const subsDone=subs.filter(s=>s.done).length;
      const sources=[];
      if(t._inDue)sources.push('🗓');if(t._inSprint)sources.push('⚡');if(t._inMIT)sources.push('🎯');
      return`<div class="card" style="margin-bottom:14px;${t.status==='done'?'opacity:.55;':''};border-left:3px solid ${p.color};">
        <!-- Task header -->
        <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;">
          <input type="checkbox" ${t.status==='done'?'checked':''} onchange="toggleTask('${t.id}')" style="accent-color:#3b82f6;cursor:pointer;margin-top:3px;flex-shrink:0;">
          <div style="flex:1;">
            <div style="font-size:15px;font-weight:600;color:${t.status==='done'?'#64748b':'#f1f5f9'};${t.status==='done'?'text-decoration:line-through;':''}margin-bottom:4px;">${t.title}</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
              ${phaseChip(t.phase)}
              ${sChip(t.status)}
              <span style="font-size:11px;color:${pColor(t.priority)};background:${pColor(t.priority)}15;padding:1px 7px;border-radius:999px;">${pLabel(t.priority)}</span>
              <span style="font-size:11px;color:#475569;">🍅 ${t.pomodoros}</span>
              ${sources.map(s=>`<span style="font-size:11px;color:#475569;">${s}</span>`).join('')}
            </div>
          </div>
          <button class="btn btn-secondary btn-sm" onclick="openTaskModal('${t.id}')">Editer</button>
        </div>
        <!-- Description -->
        ${t.description?`<div style="font-size:13px;color:#94a3b8;line-height:1.7;background:#0f172a;border-radius:8px;padding:10px 12px;margin-bottom:10px;">${esc(t.description)}</div>`:''}
        <!-- Subtasks -->
        ${subs.length>0?`
        <div style="margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <span style="font-size:12px;color:#64748b;">Sous-taches</span>
            <span style="font-size:12px;color:${subsDone===subs.length?'#10b981':'#64748b'};">${subsDone}/${subs.length}</span>
          </div>
          ${bar(subs.length?subsDone/subs.length*100:0,p.color,'6px')}
          <div style="margin-top:8px;">
            ${subs.map(s=>`<div style="display:flex;align-items:center;gap:7px;padding:4px 0;border-bottom:1px solid #33415530;">
              <span style="color:${s.done?'#10b981':'#475569'};font-size:13px;">${s.done?'✓':'○'}</span>
              <span style="font-size:12px;color:${s.done?'#475569':'#e2e8f0'};${s.done?'text-decoration:line-through;':''}">${esc(s.title)}</span>
              <span style="font-size:11px;color:#475569;margin-left:auto;">🍅${s.pomodoros}</span>
            </div>`).join('')}
          </div>
        </div>`:'' }
        <!-- Tags -->
        ${(t.tags||[]).length>0?`<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;">${t.tags.map(tg=>`<span style="font-size:11px;background:#1e293b;color:#64748b;padding:1px 7px;border-radius:4px;border:1px solid #33415550;">${tg}</span>`).join('')}</div>`:''}
        <!-- Actions -->
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          ${t.status!=='done'&&subs.length>0?`<button class="btn btn-primary btn-sm" onclick="startSession('${t.id}')">▶ Demarrer session</button>`:''}
          ${t.status==='todo'?`<button class="btn btn-success btn-sm" onclick="quickStatus('${t.id}','inprogress')">Commencer</button>`:''}
          ${t.status==='inprogress'?`<button class="btn btn-success btn-sm" onclick="quickStatus('${t.id}','done')">Marquer termine</button>`:''}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

        <span style="font-size:14px;">${l.icon}</span>
        <span>${l.label}</span>
        ${l.id==='journal'&&dr.length>0?`<span style="margin-left:auto;background:#8b5cf6;color:#fff;font-size:10px;padding:1px 6px;border-radius:999px;font-weight:700;">${dr.length}</span>`:''}
      </div>`).join('')}
    </nav>
    <div style="padding:11px;background:#0f172a;border-radius:9px;margin-top:14px;">
      <div style="color:#f1f5f9;font-weight:600;font-size:13px;margin-bottom:4px;">🔥 ${S.streak} jour(s)</div>
      <div style="color:#475569;font-size:11px;margin-bottom:7px;">Jour ${daysSinceStart()} / ~1080</div>
      ${bar(Math.min(daysSinceStart()/1080*100,100),'#3b82f6')}
      <div style="color:#475569;font-size:10px;margin-top:4px;">${PHASES[currentPhase()].short}</div>
    </div>
  </div>
  <div class="main">${(views[S.view]||viewDashboard)()}</div>`;
}

// Init
load();
S.calendarDate=tod();
initDB().then(()=>render()).catch(()=>render());
</script>
</body>
</html>
